[general]
threads = 27          ; многопоточность: сколько аккаунтов обрабатывать одновременно (фосет и бридж)
loop = 1             ; 1 — после кругов остаться и клеймить фосет раз в сутки, 0 — один проход и выход
pause_min = 3        ; пауза между действиями активностей, с
pause_max = 10
terminal = all        ; points — в терминале только таблица поинтов (полный лог в logs/bot.log), all — весь лог

[faucet]
claim = 0            ; 1 — пробовать клейм 0.1 HYPE (сервер ответит транзакцией или кулдауном), 0 — пропуск

[bridge]
bridge = 2          ; 0 — пропуск, 1 — Elysium → HyperEVM, 2 — туда и обратно (обратно — из баланса HyperEVM)
bridge_min = 0.00001  ; сумма вывода в HYPE: случайная от min до max
bridge_max = 0.00003
bridge_rounds = 3    ; сколько кругов сделать за запуск (перезапуск — снова столько же); круг = вывод [+ депозит при bridge=2]
claim_min = 0.0001   ; выводы HYPE меньше этого не клеймить на HyperEVM (газ за клейм дороже суммы)
hyperevm_reserve = 0.001 ; столько HYPE на HyperEVM не тратить на депозиты обратно — это газ для клеймов

; ── активности в экосистеме: один проход на аккаунт сразу после старта, дальше раз в сутки (при loop=1) ──
; суммы в HYPE, если не сказано иначе; 0 в ключе включения — действие пропускается

[wrap]
wrap = 2             ; 0 — пропуск, 1 — HYPE → WHYPE, 2 — HYPE → WHYPE и обратно
wrap_min = 0.0001
wrap_max = 0.0003
wrap_rounds = 1

[swap]
swap = 2             ; 0 — пропуск, 1 — HYPE → USDC, 2 — HYPE → USDC и обратно (UniswapV2 на Elysium)
swap_min = 0.0001
swap_max = 0.0003
swap_rounds = 1
slippage = 3         ; %

[elyra]
elyra = 1            ; 0 — пропуск, 1 — лендинг Elyra (поинты за открытые позиции каждый час)
elyra_faucet = 1     ; 1 — клеймить фосет Elyra: 100 USDC + 100 ELYRA раз в 24 ч (только газ)
supply_hype_min = 0.03   ; поинты Elyra только за позиции от $1 → от ~0.015 HYPE
supply_hype_max = 0.05
supply_usdc_share = 50     ; % баланса USDC внести в рынок USDC (0 — не вносить)
elyra_borrow = 0     ; 1 — ещё залог HYPE и небольшой займ USDC (займ даёт x2 поинтов)
collateral_min = 0.03
collateral_max = 0.05
borrow_share = 25    ; % от лимита займа — далеко от ликвидации

[token_bridge]
tbridge = 2          ; 0 — пропуск, 1 — Elysium → HyperEVM, 2 — ещё и обратно с HyperEVM (то, что уже вернулось)
token = USDC         ; USDC или WHYPE
tbridge_min = 1      ; в единицах токена (для WHYPE — например 0.0001)
tbridge_max = 3
tbridge_rounds = 1
tbridge_buy = 1      ; 1 — если токена на Elysium не хватает, докупить (USDC — свопом за HYPE, WHYPE — wrap)

[ely]
ely = 1              ; 1 — зарегистрировать домен .ely (один раз на аккаунт) и сделать его основным
ely_max_price = 0.1  ; HYPE; имена от 6 символов стоят 0.1

[hunt]
hunt = 1             ; 1 — ежедневные квесты Elysium Hunt (чек-in +100 EXP, транзакция +250 EXP при наличии карты)
hunt_mint = 0        ; 1 — сминтить карту, если её нет (нужна для квеста-транзакции)
hunt_max_price = 0.05

[hyperevm_gas]
; python hyperevm_gas.py — газ на HyperEVM для всех: донор раздаёт, каждый делает один крупный вывод из Elysium
donor = 1            ; номер строки accounts.txt с HYPE на HyperEVM (например, после крана Alchemy)
topup = 0.002        ; докинуть до этой суммы тем, у кого на HyperEVM меньше topup_below
topup_below = 0.001
big_withdraw = 0.05  ; один вывод Elysium → HyperEVM на аккаунт, если на HyperEVM меньше половины этого

[hyperevm_faucet]
; python alchemy_faucet.py — кран Alchemy 0.1 HYPE/24 ч (только адресам с 0.01 HYPE в мейннете Hyperliquid)
min_balance = 0.05
threads = 5

[kalos]
; kalos.fun — главный DEX и NFT-маркетплейс Elysium
kalos_swap = 2       ; 0 — пропуск, 1 — HYPE → KALOS, 2 — HYPE → KALOS и обратно
swap_min = 0.0005
swap_max = 0.001
kalos_nft = 1        ; 1 — минт NFT в открытом публичном дропе (по одной из каждой коллекции)
nft_max_price = 0.001
slippage = 5         ; %
kalos_checkin = 1   ; ежедневный чек-ин на kalos.fun/rewards (поинты, вход по подписи, без газа)
kalos_claim = 1   ; забирать ежедневную награду KALOS (1M KALOS/день делится по поинтам)

[bunnypad]
; bunnypad.fun — покупка токена, который сейчас покупают другие
bunnypad = 2         ; 0 — пропуск, 1 — купить, 2 — купить и продать обратно
buy_min = 0.03   ; сделка засчитывается от $1, а BunnyPad считает HYPE = $40 → от 0.025 HYPE
buy_max = 0.05
slippage = 5
bunny_launch = 1   ; запуск своего токена раз в день: +100 поинтов (первый +150), до 10 запусков, 0.015 HYPE

[perpme]
; perpme.fun/elysium — покупка свежего токена в их Uniswap V3
perpme = 1           ; 0 — пропуск, 1 — купить
buy_min = 0.0005
buy_max = 0.001
slippage = 5

[games]
; одна ставка в день, деньги тестовые
elysa = 1            ; elysa.fun — монетка, ставка от 0.01 HYPE (минимум контракта)
elysa_bet = 0.05   ; поинты ELYSA: 666 за 1 HYPE ставки + бонус серии; монетка теряет в среднем 2% ставки
frogflip = 1         ; frogflip.xyz — монетка, ставка от 0.001 HYPE
frog_min = 0.001
frog_max = 0.002
frog_name = 1        ; 1 — задать случайный ник в Frog Flip, если его нет (один раз, только газ)

[hl_faucet]
; python hl_faucet.py — кран тестнета Hyperliquid (1000 USDC/сутки) → покупка HYPE → перевод в HyperEVM
; кран выдаёт только адресам с аккаунтом в мейннете Hyperliquid (был хоть один депозит)
hl_faucet = 1        ; 1 — каждый день в составе активностей main.py
keep_usdc = 1        ; столько USDC оставить на споте
slippage = 2         ; %

[points]
; таблица «мои / 10-е место лидерборда» по Kalos, BunnyPad, Elyra, ELYSA, Hunt; отдельно: python points.py
points = 1
points_first_minutes = 20   ; первая таблица после старта
points_every_hours = 6      ; дальше раз в столько часов
